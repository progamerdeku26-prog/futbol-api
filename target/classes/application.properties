spring.application.name=futbol-api
server.port=8080

# ===== Conexion con MySQL =====
# Cambia usuario y contrasena por los de tu MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/futbol_db?createDatabaseIfNotExist=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update: crea las tablas si no existen y no borra datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Fechas en formato yyyy-MM-dd en el JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Swagger (documentacion) =====
springdoc.swagger-ui.path=/swagger-ui.html
